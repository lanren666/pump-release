name: Build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: snapshot (verify) or release (public)
        type: choice
        required: true
        default: snapshot
        options:
          - snapshot
          - release
      version:
        description: "x.y.z or x.y.z+n (empty = pubspec build number +1, e.g. 1.1.1+2 -> 1.1.1+3)"
        type: string
        required: false
        default: ""
      platforms:
        description: Which platforms to build
        type: choice
        required: true
        default: all
        options:
          - all
          - android
          - ios

concurrency:
  group: pump-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.35.7"
  OSS_ENDPOINT: oss-cn-shenzhen.aliyuncs.com
  OSS_BUCKET: sporra-mom

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.meta.outputs.build_name }}
      build_number: ${{ steps.meta.outputs.build_number }}
      flutter_version: ${{ steps.meta.outputs.flutter_version }}
      artifact_prefix: ${{ steps.meta.outputs.artifact_prefix }}
      channel: ${{ steps.meta.outputs.channel }}
      channel_label: ${{ steps.meta.outputs.channel_label }}
      oss_dir: ${{ steps.meta.outputs.oss_dir }}
      oss_apk: ${{ steps.meta.outputs.oss_apk }}
      oss_ipa: ${{ steps.meta.outputs.oss_ipa }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          pubspec_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          pub_name="${pubspec_version%%+*}"
          pub_number="${pubspec_version##*+}"
          if [[ "$pubspec_version" != *"+"* ]] || ! [[ "$pub_number" =~ ^[0-9]+$ ]]; then
            echo "pubspec.yaml version must be x.y.z+n, got: $pubspec_version" >&2
            exit 1
          fi

          raw="${INPUT_VERSION:-}"
          raw="${raw#"${raw%%[![:space:]]*}"}"
          raw="${raw%"${raw##*[![:space:]]}"}"

          if [ -z "$raw" ]; then
            build_name="$pub_name"
            build_number="$((pub_number + 1))"
          elif [[ "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            build_name="${raw%%+*}"
            build_number="${raw##*+}"
            if [ "$build_number" -le "$pub_number" ]; then
              echo "Build number $build_number must be greater than pubspec $pub_number" >&2
              exit 1
            fi
          elif [[ "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            build_name="$raw"
            build_number="$((pub_number + 1))"
          else
            echo "Version must be x.y.z or x.y.z+n, got: $raw" >&2
            exit 1
          fi

          channel="${INPUT_CHANNEL:-snapshot}"
          if [ "$channel" = "release" ]; then
            channel_label="RELEASE"
          else
            channel_label="SNAPSHOT"
          fi

          flutter_version="${build_name}+${build_number}"
          prefix="SporraMom-v${build_name}-${channel_label}"
          oss_dir="apks/v${build_name}"
          oss_apk="${prefix}.apk"
          oss_ipa="${prefix}.ipa"

          {
            echo "build_name=$build_name"
            echo "build_number=$build_number"
            echo "flutter_version=$flutter_version"
            echo "artifact_prefix=$prefix"
            echo "channel=$channel"
            echo "channel_label=$channel_label"
            echo "oss_dir=$oss_dir"
            echo "oss_apk=$oss_apk"
            echo "oss_ipa=$oss_ipa"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $flutter_version -> oss://sporra-mom/${oss_dir}/${oss_apk}"

      - name: Persist version in pubspec.yaml
        env:
          FLUTTER_VERSION_LINE: ${{ steps.meta.outputs.flutter_version }}
        run: |
          set -euo pipefail
          current="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          if [ "$current" = "$FLUTTER_VERSION_LINE" ]; then
            echo "pubspec.yaml already at $current"
            exit 0
          fi
          sed -i -E "s/^version: .*/version: ${FLUTTER_VERSION_LINE}/" pubspec.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${FLUTTER_VERSION_LINE}"
          git push
          echo "Committed pubspec.yaml version $FLUTTER_VERSION_LINE"

  android:
    name: Android
    needs: prepare
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: true
          local-cache: true

      - name: Restore Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "Missing Android signing secrets (ANDROID_KEYSTORE_BASE64 / PASSWORD / KEY_PASSWORD / KEY_ALIAS)" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/sporramom-release.keystore
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=sporramom-release.keystore"
          } > android/key.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android debug APK
        run: |
          flutter build apk --debug \
            --build-name "${{ needs.prepare.outputs.build_name }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}"
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "${{ needs.prepare.outputs.artifact_prefix }}-debug.apk"

      - name: Build Android release APK
        run: |
          flutter build apk --release \
            --build-name "${{ needs.prepare.outputs.build_name }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "${{ needs.prepare.outputs.oss_apk }}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-android
          path: |
            ${{ needs.prepare.outputs.artifact_prefix }}-debug.apk
            ${{ needs.prepare.outputs.oss_apk }}
          if-no-files-found: error

  ios:
    name: iOS
    needs: prepare
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'ios' }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Cache CocoaPods
        id: pods-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods
        run: |
          cd ios
          if [ "${{ steps.pods-cache.outputs.cache-hit }}" = "true" ]; then
            pod install
          else
            pod install --repo-update
          fi

      - name: Build iOS debug (unsigned)
        run: |
          set -euo pipefail
          flutter build ios --debug --no-codesign \
            --build-name "${{ needs.prepare.outputs.build_name }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}"
          prefix="${{ needs.prepare.outputs.artifact_prefix }}"
          app="$(find build/ios -path '*iphoneos/Runner.app' -type d | head -n 1)"
          if [ -z "$app" ]; then
            echo "Runner.app not found after debug build" >&2
            find build/ios -name 'Runner.app' -o -name '*.app' >&2 || true
            exit 1
          fi
          rm -rf Payload
          mkdir Payload
          cp -R "$app" Payload/Runner.app
          zip -r -y "${prefix}-debug.ipa" Payload
          rm -rf Payload

      - name: Build iOS release (unsigned)
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-name "${{ needs.prepare.outputs.build_name }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}"
          ipa="${{ needs.prepare.outputs.oss_ipa }}"
          app="$(find build/ios -path '*iphoneos/Runner.app' -type d | head -n 1)"
          if [ -z "$app" ]; then
            echo "Runner.app not found after release build" >&2
            find build/ios -name 'Runner.app' -o -name '*.app' >&2 || true
            exit 1
          fi
          rm -rf Payload
          mkdir Payload
          cp -R "$app" Payload/Runner.app
          zip -r -y "$ipa" Payload
          rm -rf Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-ios
          path: |
            ${{ needs.prepare.outputs.artifact_prefix }}-debug.ipa
            ${{ needs.prepare.outputs.oss_ipa }}
          if-no-files-found: error

  upload-oss:
    name: Upload OSS
    needs: [prepare, android, ios]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.android.result == 'success' || needs.ios.result == 'success') && (needs.android.result == 'success' || needs.android.result == 'skipped') && (needs.ios.result == 'success' || needs.ios.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Android artifacts
        if: ${{ needs.android.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-android
          path: dist

      - name: Download iOS artifacts
        if: ${{ needs.ios.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-ios
          path: dist

      - name: Cache ossutil
        id: ossutil-cache
        uses: actions/cache@v4
        with:
          path: ossutil64
          key: ossutil-1.7.16-linux

      - name: Download ossutil
        if: ${{ steps.ossutil-cache.outputs.cache-hit != 'true' }}
        run: |
          curl -L https://gosspublic.alicdn.com/ossutil/1.7.16/ossutil64 -o ossutil64
          chmod +x ossutil64

      - name: Make ossutil executable
        run: chmod +x ossutil64

      - name: Configure ossutil
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${ALIYUN_ACCESS_KEY_ID:-}" ] || [ -z "${ALIYUN_ACCESS_KEY_SECRET:-}" ]; then
            echo "Missing ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET" >&2
            exit 1
          fi
          ./ossutil64 config -e "$OSS_ENDPOINT" -i "$ALIYUN_ACCESS_KEY_ID" -k "$ALIYUN_ACCESS_KEY_SECRET"

      - name: Upload packages to OSS
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_NAME: ${{ needs.prepare.outputs.build_name }}
          OSS_DIR: ${{ needs.prepare.outputs.oss_dir }}
          OSS_APK: ${{ needs.prepare.outputs.oss_apk }}
          OSS_IPA: ${{ needs.prepare.outputs.oss_ipa }}
        run: |
          set -euo pipefail
          dest="oss://${OSS_BUCKET}/${OSS_DIR}"

          oss_exists() {
            ./ossutil64 stat "$1" >/dev/null 2>&1
          }

          remote_apk="${OSS_APK}"
          remote_ipa="${OSS_IPA}"
          if [ "${CHANNEL}" = "snapshot" ]; then
            base="SporraMom-v${BUILD_NAME}-SNAPSHOT"
            if oss_exists "${dest}/${base}.apk" || oss_exists "${dest}/${base}.ipa"; then
              n=1
              while oss_exists "${dest}/${base}${n}.apk" || oss_exists "${dest}/${base}${n}.ipa"; do
                n=$((n + 1))
              done
              remote_apk="${base}${n}.apk"
              remote_ipa="${base}${n}.ipa"
            fi
            echo "Snapshot OSS names: ${remote_apk} ${remote_ipa}"
          fi

          if [ -f "dist/${OSS_APK}" ]; then
            ./ossutil64 cp "dist/${OSS_APK}" "${dest}/${remote_apk}" --force
            echo "Uploaded ${dest}/${remote_apk}"
          fi
          if [ -f "dist/${OSS_IPA}" ]; then
            ./ossutil64 cp "dist/${OSS_IPA}" "${dest}/${remote_ipa}" --force
            echo "Uploaded ${dest}/${remote_ipa}"
          fi
          ./ossutil64 ls "${dest}/"

          if [ "${CHANNEL}" != "release" ]; then
            echo "Skip latest/ rotation for channel=${CHANNEL}"
            exit 0
          fi
          if [ ! -f "dist/${OSS_APK}" ]; then
            echo "Skip latest/ rotation: release APK not built"
            exit 0
          fi

          latest="oss://${OSS_BUCKET}/latest/SporraMom-latest.apk"
          if ./ossutil64 stat "${latest}" >/dev/null 2>&1; then
            day="$(TZ=Asia/Shanghai date +%Y%m%d)"
            archive="oss://${OSS_BUCKET}/latest/SporraMom-latest_${day}.apk"
            if ./ossutil64 stat "${archive}" >/dev/null 2>&1; then
              archive="oss://${OSS_BUCKET}/latest/SporraMom-latest_$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S).apk"
            fi
            ./ossutil64 cp "${latest}" "${archive}" --force
            echo "Archived previous latest -> ${archive}"
          else
            echo "No previous ${latest}"
          fi

          ./ossutil64 cp "dist/${OSS_APK}" "${latest}" --force --acl public-read
          ./ossutil64 set-acl "${latest}" public-read -f
          echo "Published ${latest} (public-read)"
          ./ossutil64 ls "oss://${OSS_BUCKET}/latest/"
